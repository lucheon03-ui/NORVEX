<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>html{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>NORVEX</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500;700&display=swap">
<style>
/* Layout: 상단 헤더 / 좌 캐릭터 · 중앙 지도+행동 · 우 자료+인벤토리 / 하단 채팅. 아침/밤 테마 전환 */
:root {
  --bg: #050805; --panel: #0b120b; --panel2: #111d11; --line: #285528;
  --ink: #c7ffc7; --soft: #86b886; --accent: #39ff14; --accent-dim: #173817;
  --brass: #d7ff45; --danger: #ff7168; --danger-dim: #4b1717;
  --hover: #245b24; --brass-bg: #343d0b; --brass-ink: #efffa8; --faint: #719671; --npc: #c1a5ff;
  --warn-bg: #202407; --warn-ink: #eaff91; --stripe1: #091109; --stripe2: #0d170d; --mapbg: #050a05;
  --font: "IBM Plex Sans KR", system-ui, sans-serif; --mono: "IBM Plex Mono", ui-monospace, monospace;
  color-scheme: dark;
}
/* 아침 모드: 흰 배경과 검은 글자. 호스트의 data-theme과 겹치지 않도록 data-mode 사용 */
:root[data-mode="day"] {
  --bg: #ffffff; --panel: #ffffff; --panel2: #f3f5f3; --line: #c9d0c9;
  --ink: #111511; --soft: #414a41; --accent: #176b2c; --accent-dim: #e0f1e3;
  --brass: #8a5b00; --danger: #bd2e25; --danger-dim: #fbe5e2;
  --hover: #d3ead7; --brass-bg: #fff0c7; --brass-ink: #533700; --faint: #657165; --npc: #6946a8;
  --warn-bg: #fff7dc; --warn-ink: #5c4300; --stripe1: #f7f9f7; --stripe2: #edf1ed; --mapbg: #f5f7f5;
  color-scheme: light;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 14px; line-height: 1.6;
  padding-block: 10px 24px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
h1, h2, h3, h4 { margin: 0; font-weight: 700; text-wrap: balance; }
h2 { font-size: 15px; } h3 { font-size: 13px; letter-spacing: .04em; color: var(--accent); }
p { margin: 0; }
button {
  font: inherit; cursor: pointer; border-radius: 4px; padding: 6px 12px; font-weight: 500;
  background: var(--accent-dim); color: var(--ink); border: 1px solid var(--accent);
}
button:hover:not(:disabled) { background: var(--hover); }
button:disabled { opacity: .4; cursor: not-allowed; }
button.ghost { background: transparent; border-color: var(--line); color: var(--soft); }
button.ghost:hover:not(:disabled) { border-color: var(--accent); color: var(--ink); background: transparent; }
button.danger { background: var(--danger-dim); border-color: var(--danger); }
button.brass { background: var(--brass-bg); border-color: var(--brass); color: var(--brass-ink); }
button.sm { padding: 2px 8px; font-size: 12px; }
input, select, textarea {
  font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line);
  border-radius: 4px; padding: 5px 8px; min-width: 0; width: 100%;
}
input[type="checkbox"] { width: auto; }
input[type="file"] { padding: 3px; }
textarea { resize: vertical; min-height: 64px; }
label { display: flex; flex-direction: column; gap: 3px; color: var(--soft); font-size: 12px; }
:focus-visible { outline: 2px solid var(--brass); outline-offset: 1px; }
.mono { font-family: var(--mono); }
.soft { color: var(--soft); }
body[data-role="player"] .gm-only { display: none !important; }

/* 헤더 */
.top { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; padding: 10px 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; }
.logo { font-family: var(--mono); font-weight: 700; letter-spacing: .3em; font-size: 18px; color: var(--accent); }
.clock { font-family: var(--mono); color: var(--brass); }
.top .grow { flex: 1 1 20px; }
.top .group { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.top select { width: auto; }
.top input[type="range"] { width: 80px; padding: 0; }
.banner { margin-top: 8px; padding: 6px 12px; border: 1px dashed var(--brass); border-radius: 4px; color: var(--warn-ink); background: var(--warn-bg); font-size: 12px; }

/* 본문 그리드 */
.ztable { min-width: 0; }
.ztable thead { display: none; }
.ztable tr { display: block; padding: 6px 0; border-top: 1px solid var(--line); }
.ztable tr:first-child { border-top: 0; }
.ztable td { display: block; border: 0; padding: 1px 0; }
.ztable td[data-l]::before { content: attr(data-l) " · "; color: var(--soft); }
.grid { display: grid; grid-template-columns: 280px minmax(0, 1fr) 320px; gap: 10px; margin-top: 10px; align-items: start; }
.col { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 12px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.card > .head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: end; }
.row > * { min-width: 0; }
.tag { display: inline-block; padding: 0 8px; border: 1px solid var(--line); border-radius: 3px; font-size: 11px; color: var(--soft); }
.tag.warn { border-color: var(--brass); color: var(--brass); }
.tag.bad { border-color: var(--danger); color: var(--danger); }
.tag.ok { border-color: var(--accent); color: var(--accent); }

/* 캐릭터 카드 */
.pc { display: grid; grid-template-columns: 48px 1fr; gap: 4px 10px; padding: 8px; background: var(--panel2); border: 1px solid var(--line); border-radius: 5px; cursor: pointer; }
.pc.me { border-color: var(--accent); }
.pc:hover { border-color: var(--brass); }
.pc .ph { width: 48px; height: 48px; border-radius: 4px; background: var(--bg); border: 1px solid var(--line); display: grid; place-items: center; font-family: var(--mono); color: var(--accent); overflow: hidden; }
.pc .ph img { width: 100%; height: 100%; object-fit: cover; }
.pc .nm { font-weight: 700; display: flex; justify-content: space-between; gap: 6px; }
.pips { display: grid; grid-template-columns: repeat(2, 1fr); gap: 2px 10px; grid-column: 1 / -1; }
.pip { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: var(--soft); }
.pip i { display: inline-flex; gap: 2px; } .pip b { width: 7px; height: 7px; background: var(--line); display: block; }
.pip b.on { background: var(--accent); }
.pcfoot { grid-column: 1 / -1; display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
.pcfoot select { width: auto; font-size: 11px; padding: 1px 4px; }

/* 지도 */
.mapwrap { border: 1px solid var(--line); border-radius: 5px; background: var(--mapbg); overflow: auto; max-height: 560px; }
.mapwrap img { display: block; max-width: none; }
.stage { position: relative; line-height: 0; }
.stage img { width: 100%; }
.mdot { position: absolute; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; line-height: 1.2; touch-action: none; user-select: none; }
.mdot.drag { cursor: grab; } .mdot.drag:active { cursor: grabbing; }
.stage.empty { aspect-ratio: 16 / 9; min-height: 240px; display: grid; place-items: center; background-color: var(--stripe1); background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px); background-size: 40px 40px; }
.hintmap { line-height: 1.5; color: var(--soft); }
.tokens { display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--line); padding-top: 10px; }
.mdot img { width: var(--tk, 44px); height: var(--tk, 44px); object-fit: contain; pointer-events: none; }
.mdot .mi { width: 30px; height: 30px; border-radius: 50%; background: var(--accent-dim); border: 1px solid var(--accent); display: grid; place-items: center; font-family: var(--mono); }
.mdot.npc .mi { background: var(--panel2); border-color: var(--npc); color: var(--npc); border-radius: 6px; }
.mdot.npc img { border-radius: 6px; outline: 2px solid var(--npc); outline-offset: 1px; }
.mdot.npc .ml { color: var(--npc); }
.mdot.off { opacity: .45; }
.mdot .ml { font-size: 11px; background: rgba(0, 0, 0, .7); padding: 0 5px; border-radius: 3px; margin-top: 2px; white-space: nowrap; }
.zonemap { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; padding: 10px; min-height: 200px; }
.zbox { border: 1px solid var(--line); border-radius: 4px; padding: 8px; min-height: 80px; display: flex; flex-direction: column; gap: 6px; background: repeating-linear-gradient(135deg, var(--stripe1), var(--stripe1) 8px, var(--stripe2) 8px, var(--stripe2) 16px); }
.zbox.locked { border-color: var(--danger); } .zbox.fog { opacity: .55; border-style: dashed; }
.zbox .zn { font-weight: 700; font-size: 12px; }
.dots { display: flex; gap: 4px; flex-wrap: wrap; }
.dot { width: 22px; height: 22px; border-radius: 50%; background: var(--accent-dim); border: 1px solid var(--accent); display: grid; place-items: center; font-size: 10px; font-family: var(--mono); }
.dot.mon { background: var(--danger-dim); border-color: var(--danger); }
.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 12px; min-width: 480px; }
th, td { text-align: left; padding: 5px 8px; border-top: 1px solid var(--line); vertical-align: top; }
th { color: var(--soft); font-weight: 500; border-top: 0; }

/* 판정 */
.roll { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center; padding: 10px; border: 1px dashed var(--line); border-radius: 5px; }
.roll .big { font-family: var(--font); font-size: 28px; font-weight: 700; line-height: 1.1; min-width: 96px; text-align: center; }
.roll .big.ok { color: var(--accent); } .roll .big.bad { color: var(--danger); }

/* 목록 */
.list { display: flex; flex-direction: column; gap: 4px; }
.item { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 6px 8px; background: var(--panel2); border: 1px solid var(--line); border-radius: 4px; }
.item button.link { background: none; border: 0; color: var(--ink); text-align: left; padding: 0; font-weight: 500; }
.item button.link:hover { color: var(--brass); }
.slots { display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px; }
.slot { min-height: 34px; padding: 4px 8px; border: 1px solid var(--line); border-radius: 4px; background: var(--panel2); font-size: 12px; overflow-wrap: anywhere; }
.slot.empty { color: var(--faint); border-style: dashed; }

/* 채팅 */
.chatlog { height: 340px; overflow-y: auto; display: flex; flex-direction: column; gap: 3px; padding: 8px; background: var(--bg); border: 1px solid var(--line); border-radius: 5px; }
.msg { display: flex; gap: 8px; align-items: flex-start; overflow-wrap: anywhere; }
.msg time { font-family: var(--mono); font-size: 11px; color: var(--faint); flex: none; }
.msg .who { font-weight: 700; flex: none; }
.msg.gm .who { color: var(--brass); } .msg.npc .who { color: var(--npc); } .msg.system { color: var(--soft); }
.msg.dice, .msg.investigate { color: var(--accent); } .msg.event { color: var(--danger); font-weight: 700; }
.msg.whisper { font-style: italic; opacity: .9; }
.chatin { display: grid; grid-template-columns: auto auto 1fr auto; gap: 6px; }
.chatin select { width: auto; max-width: 170px; }

/* 모달 */
#modal { position: fixed; inset: 0; z-index: 50; display: grid; place-items: start center; padding: 24px 12px; overflow-y: auto; }
.mback { position: fixed; inset: 0; background: rgba(2, 6, 4, .75); }
.mbox { position: relative; width: min(100%, 640px); background: var(--panel); border: 1px solid var(--accent); border-radius: 6px; }
.mbox.wide { width: min(100%, 940px); }
.mhead { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.mbody { padding: 14px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.tabs button { background: transparent; border-color: var(--line); color: var(--soft); }
.tabs button[aria-pressed="true"] { background: var(--accent-dim); color: var(--ink); border-color: var(--accent); }
.f2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }
.skills { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 2px 8px; }
.skills label { flex-direction: row; align-items: center; gap: 4px; color: var(--ink); }
.err { color: var(--danger); min-height: 1.4em; }

button.link { background: none; border: 0; color: var(--ink); text-align: left; padding: 0; font-weight: 500; }
button.link:hover { color: var(--brass); background: none; }
.slot { display: flex; justify-content: space-between; align-items: center; gap: 4px; }
.av { width: 30px; height: 30px; flex: none; border-radius: 50%; overflow: hidden; background: var(--accent-dim); border: 1px solid var(--accent); display: grid; place-items: center; font-size: 11px; font-family: var(--mono); }
.av img { width: 100%; height: 100%; object-fit: cover; }
.av.gmav { background: var(--brass-bg); border-color: var(--brass); color: var(--brass); }
.av.none { border-color: transparent; background: none; }
.msg > span:not(.av) { padding-top: 5px; }
/* 연출 */
#fx { position: fixed; inset: 0; z-index: 90; display: grid; place-items: center; background: #000; color: #fff; text-align: center; padding: 20px; }
#fx .fxin { display: flex; flex-direction: column; gap: 12px; align-items: center; }
#fx img { max-width: min(80vw, 420px); max-height: 50vh; }
#fx h2 { font-size: 34px; color: var(--danger); }
#fx.shake .fxin { animation: shake .5s 2; }
@keyframes shake { 0%,100% { transform: translate(0); } 20% { transform: translate(-8px, 3px); } 40% { transform: translate(7px, -4px); } 60% { transform: translate(-5px, -3px); } 80% { transform: translate(6px, 4px); } }
#toast { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: 16px; z-index: 100; background: var(--panel2); border: 1px solid var(--accent); padding: 8px 14px; border-radius: 4px; }

@media (max-width: 1100px) { .grid { grid-template-columns: 250px minmax(0, 1fr); } .grid > .col:last-child { grid-column: 1 / -1; } }
@media (max-width: 720px) { .grid { grid-template-columns: minmax(0, 1fr); } .chatin { grid-template-columns: 1fr 1fr; } .chatin input { grid-column: 1 / -1; } .zonemap { grid-template-columns: repeat(2, minmax(0, 1fr)); } #maincol { order: -1; } }
@media (prefers-reduced-motion: reduce) { #fx.shake .fxin { animation: none; } }
</style>
</head>
<body>
<div class="top">
  <span class="logo">NORVEX</span>
  <span class="clock" id="clock"></span>
  <span class="grow"></span>
  <div class="group">
    <label style="flex-direction:row;align-items:center;gap:6px">플레이 캐릭터
      <select id="role" aria-label="플레이할 캐릭터 선택"></select>
    </label>
    <span class="tag warn" id="rolebadge"></span>
  </div>
  <div class="group">
    <select id="bgm-sel" aria-label="BGM 선택" style="width:auto;max-width:150px"></select>
    <button class="ghost sm" id="bgm-btn" type="button">BGM 재생</button>
    <input id="bgm-vol" type="range" min="0" max="100" value="40" aria-label="BGM 음량">
  </div>
  <div class="group">
    <span class="mono" id="timer">00:00</span>
    <button class="ghost sm" id="timer-btn" type="button">시작</button>
    <button class="ghost sm" id="timer-rst" type="button">초기화</button>
  </div>
  <div class="group">
    <button class="ghost sm" id="mode-btn" type="button">아침 모드</button>
    <button class="brass sm" id="save-btn" type="button">세션 저장</button>
    <span class="soft mono" id="save-state" aria-live="polite"></span>
    <label style="flex-direction:row;align-items:center;gap:4px"><input type="checkbox" id="auto-save"> 자동 저장</label>
    <button class="ghost sm" id="set-btn" type="button">설정</button>
    <button class="brass sm gm-only" id="next-btn" type="button">다음 시간대</button>
    <button class="brass sm gm-only" id="gm-btn" type="button">GM 관리</button>
  </div>
</div>
<p class="banner" id="room-banner">로비에서 승인된 방에 입장해 주세요. GM은 세션 저장을 할 수 있고 플레이어는 캐릭터를 선택해 진행할 수 있습니다.</p>

<div class="grid">
  <div class="col" id="left"></div>
  <div class="col" id="maincol">
  <div class="col" id="center"></div>
<div class="card">
  <div class="head"><h2>채팅</h2><span class="soft" id="chatscope"></span></div>
  <div class="chatlog" id="chatlog" aria-live="polite"></div>
  <form class="chatin" id="chatform">
    <select id="c-speaker" aria-label="발언자"></select>
    <select id="c-to" aria-label="공개 대상"></select>
    <input id="c-text" type="text" placeholder="메시지를 입력하세요" autocomplete="off">
    <button type="submit">전송</button>
  </form>
</div>
  </div>
  <div class="col" id="right"></div>
</div>

<div id="modal" hidden></div>
<div id="fx" hidden></div>
<div id="toast" hidden></div>
<audio id="bgm" loop></audio>

  async function initCloudSave() {
    if (!roomIdFromLobby) {
      roomBanner.textContent = "로비에서 방을 연 뒤 입장해 주세요. 방에 연결되지 않은 상태에서는 게임을 진행할 수 없습니다.";
      throw new Error("room_required");
    }
    if (!window.supabase || !window.supabase.createClient) throw new Error("Supabase 라이브러리를 불러오지 못했습니다.");
    cloudClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
      auth: { persistSession: true, autoRefreshToken: true, storage: window.localStorage }
    });
    var sessionResult = await cloudClient.auth.getSession();
    if (sessionResult.error) throw sessionResult.error;
    var session = sessionResult.data && sessionResult.data.session;
    if (!session) {
      var authResult = await cloudClient.auth.signInAnonymously();
      if (authResult.error) throw authResult.error;
      session = authResult.data.session;
    }
    if (!session || !session.user) throw new Error("로그인 정보를 확인할 수 없습니다.");
    cloudUser = session.user;

    var roomResult = await cloudClient.from("rooms").select("id,gm_id,name").eq("id", roomIdFromLobby).maybeSingle();
    if (roomResult.error) throw roomResult.error;
    if (!roomResult.data) throw new Error("방을 찾을 수 없습니다.");
    var memberResult = await cloudClient.from("members").select("role,status,display_name,selected_character_id").eq("room_id", roomIdFromLobby).eq("user_id", cloudUser.id).maybeSingle();
    if (memberResult.error) throw memberResult.error;
    if (!memberResult.data || memberResult.data.status !== "approved") throw new Error("이 방에 승인된 멤버가 아닙니다.");
    cloudMember = memberResult.data;
    cloudRole = roomResult.data.gm_id === cloudUser.id && cloudMember.role === "gm" ? "gm" : (cloudMember.role === "player" ? "player" : null);
    if (!cloudRole) throw new Error("방의 GM/플레이어 권한을 확인할 수 없습니다.");

    var loadResult = await cloudClient.from("game_saves").select("game_data,updated_at").eq("room_id", roomIdFromLobby).maybeSingle();
    if (loadResult.error) throw loadResult.error;
    if (loadResult.data && loadResult.data.game_data && loadResult.data.game_data.players) {
      var saved = loadResult.data.game_data;
      mapImg = saved.__norvex_map_image || (localStorage.getItem(mapStorageKey) || "");
      delete saved.__norvex_map_image;
      state = saved;
      dirty = false;
      lastSaved = loadResult.data.updated_at ? new Date(loadResult.data.updated_at).getTime() : Date.now();
    } else {
      // 최초 세션은 브라우저의 샘플/초기 상태로 시작하며, GM이 직접 첫 저장을 합니다.
      dirty = true;
      lastSaved = null;
    }
    try {
      localStorage.setItem(roomStorageKey, JSON.stringify(state));
      localStorage.setItem(mapStorageKey, mapImg || "");
    } catch (e) {}

    if (cloudRole === "gm") ui.role = "GM";
    else {
      var savedCharacter = null;
      try { savedCharacter = localStorage.getItem(selectedCharacterKey(cloudUser.id)); } catch (e) {}
      if (!P(savedCharacter)) savedCharacter = cloudMember.selected_character_id;
      ui.role = P(savedCharacter) ? savedCharacter : (state.players[0] ? state.players[0].id : "");
      if (ui.role) {
        try { localStorage.setItem(selectedCharacterKey(cloudUser.id), ui.role); } catch (e) {}
        if (!P(savedCharacter)) {
          var initialPick = await cloudClient.rpc("set_my_selected_character", { p_room: roomIdFromLobby, p_character: ui.role });
          if (initialPick.error) console.warn("초기 캐릭터 선택 서버 기록 실패:", initialPick.error.message);
        }
      }
    }

    cloudChannel = cloudClient.channel("norvex:" + roomIdFromLobby, { config: { private: true } })
      .on("broadcast", { event: "state" }, function (message) {
        var payload = message && message.payload;
        if (!payload || payload.sender === cloudUser.id || !payload.data || !payload.data.players) return;
        applyingRemote = true;
        try {
          var incoming = payload.data;
          mapImg = incoming.__norvex_map_image || "";
          delete incoming.__norvex_map_image;
          state = incoming;
          dirty = true;
          cacheRoomState();
          fillRole();
          render();
          paintSave();
        } finally { applyingRemote = false; }
      })
      .subscribe(function (status) {
        if (status === "SUBSCRIBED") roomBanner.textContent = "방 연결 완료 · 실시간 진행 중 · 최종 세션 저장은 GM만 할 수 있습니다.";
        else if (status === "CHANNEL_ERROR" || status === "TIMED_OUT") roomBanner.textContent = "방은 연결됐지만 실시간 동기화 연결에 실패했습니다. Supabase Realtime 권한 SQL을 확인해 주세요.";
      });
    cloudReady = true;
    fillRole();
    roomBanner.textContent = "방 인증 완료 · " + (cloudRole === "gm" ? "GM" : "플레이어") + " · 실시간 동기화 연결 중";
  }

    render();
  });
})();
